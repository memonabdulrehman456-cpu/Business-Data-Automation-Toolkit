services:
  - type: web
    name: arrowstack-business-data-toolkit
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MAX_UPLOAD_MB
        value: 250
      - key: LOG_LEVEL
        value: INFO
